# Deploys the Angular app in app/ to GitHub Pages.
# Before enabling: set Settings -> Pages -> Source to "GitHub Actions".
# Note: this replaces the current static site served from the repo root.
# Re-trigger: Pages source switched to GitHub Actions (2026-08-20).
name: Deploy Angular app to Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build -- --base-href=/League-team-comp/
      # GitHub Pages has no server-side routing; serve index.html for deep links.
      - run: cp dist/bom-squad/browser/index.html dist/bom-squad/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/bom-squad/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
