# Deploys the Angular app in frontend/ to GitHub Pages.
# Before enabling: set Settings -> Pages -> Source to "GitHub Actions".
# Note: this replaces the current static site served from the repo root.
# Re-trigger: Pages source switched to GitHub Actions (2026-08-20).
name: Deploy Angular app to Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build -- --base-href=/League-team-comp/
      # GitHub Pages has no server-side routing; serve index.html for deep links.
      - run: cp dist/bom-squad/browser/index.html dist/bom-squad/browser/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist/bom-squad/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Checks what was just published, rather than what was just built. A green
  # build that serves a broken page is the failure this catches.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The drift check compares the deployed backend against api/ history,
          # so it needs more than the single commit a shallow clone gives it.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm --prefix e2e ci
      - run: npx --prefix e2e playwright install --with-deps chromium
      - name: End-to-end checks
        run: npm --prefix e2e test
        env:
          # Present only if the test account has been configured. Without them
          # the authenticated tests are not registered at all.
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-deploy
          path: e2e/playwright-report/
          retention-days: 7
