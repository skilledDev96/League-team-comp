<section aria-label="Team access">
  <div class="view-controls edit-toolbar">
    <h2 class="title-with-icon"><span class="section-icon">AC</span>Team Access</h2>
    <p class="muted edit-hint">Grant access by email and role. Admins manage; user accounts/passwords are created in the Firebase console.</p>
    <button class="view-btn active btn-cta" type="button" (click)="ctx.addAccessEntry()">+ Add member</button>
  </div>

  <div class="grid two">
    @for (draft of ctx.accessDrafts(); track draft.email + $index) {
      <article class="card">
        <label class="field"><span>Email</span>
          <input type="email" [ngModel]="draft.email" (ngModelChange)="draft.email = $event" [name]="'aemail' + $index" /></label>
        <label class="field"><span>Role</span>
          <select [ngModel]="draft.role" (ngModelChange)="draft.role = $event" [name]="'arole' + $index">
            @for (role of ctx.accessRoles; track role) { <option [value]="role">{{ role }}</option> }
          </select></label>
        <label class="field">
          <span>Active</span>
          <input type="checkbox" [ngModel]="draft.active" (ngModelChange)="draft.active = $event" [name]="'aactive' + $index" />
        </label>
        <div class="links action-row">
          <button class="view-btn active" type="button" (click)="ctx.saveAccessEntry(draft)">Save</button>
          @if (auth.canManageUsers()) {
            <app-overflow-menu>
              <button class="overflow-item danger" type="button" (click)="ctx.deleteAccessEntry(draft)">Delete member</button>
            </app-overflow-menu>
          }
        </div>
      </article>
    }
  </div>
</section>
