<section class="card">
  <h2 class="title-with-icon"><span class="section-icon">ST</span>Settings</h2>
  <label class="field">
    <span>Team name</span>
    <input type="text" [ngModel]="ctx.teamName()" (ngModelChange)="ctx.setTeamName($event)" name="ctx.teamName" />
  </label>
  <label class="field">
    <span>Motto <small class="muted">under the team's name on Home</small></span>
    <input type="text" maxlength="90" [ngModel]="ctx.motto()" (ngModelChange)="ctx.setMotto($event)" name="ctx.motto" placeholder="e.g. Draft it, then play it" />
  </label>
  <fieldset class="field admin-banner">
    <legend>Home banner <small class="muted">the splash Home opens on; empty rotates the five mains</small></legend>
    <div class="admin-banner-row">
      <label class="field"><span>Champion</span>
        <input type="text" list="admin-banner-champions" [ngModel]="ctx.bannerChampion()" (ngModelChange)="ctx.setBannerChampion($event)" name="ctx.bannerChampion" placeholder="e.g. Miss Fortune" /></label>
      <label class="field admin-banner-skin"><span>Skin number</span>
        <input type="number" min="0" step="1" [ngModel]="ctx.bannerSkin()" (ngModelChange)="ctx.setBannerSkin($event)" name="ctx.bannerSkin" /></label>
      @if (ctx.bannerChampion().trim()) {
        <button type="button" class="view-btn" (click)="ctx.clearBanner()">Clear banner</button>
      }
    </div>
    @if (ctx.bannerChampion().trim(); as champion) {
      <figure class="admin-banner-preview">
        <img [src]="ui.championSkinSplashUrl(champion, ctx.bannerSkin())" alt="" (error)="previewFailed.set(true)" (load)="previewFailed.set(false)" />
        <figcaption class="muted">
          @if (previewFailed()) { No splash under that name and skin number: Home will show the base splash instead. } @else { 0 is the base skin; Riot numbers the rest in the order they were released. }
        </figcaption>
      </figure>
    }
    <datalist id="admin-banner-champions">
      @for (name of championNames(); track name) {
        <option [value]="name"></option>
      }
    </datalist>
  </fieldset>
  <label data-tour="admin-setting-advisor" class="field field-check">
    <input type="checkbox" [ngModel]="ctx.autoAdvisor()" (ngModelChange)="ctx.setAutoAdvisor($event)" name="ctx.autoAdvisor" />
    <span>
      Ask the advisor automatically when a draft step becomes ours
      <small class="muted">Applies in the <a [routerLink]="['/tournaments']" [queryParams]="{ view: 'draft' }">draft room</a>. Off: it answers when someone presses "Ask what to pick". Either way an answer is one model call, a few cents.</small>
    </span>
  </label>
  <label class="field field-check">
    <input type="checkbox" [ngModel]="ctx.autoReview()" (ngModelChange)="ctx.setAutoReview($event)" name="ctx.autoReview" />
    <span>
      Review new prep Flex and Clash games each morning
      <small class="muted">Applies to the 06:30 run. Off: a game is reviewed when someone presses "Review this game" on Games. On: up to three new games with a timeline, about a dime each; <a [routerLink]="['/admin']" [queryParams]="{ tab: 'diagnostics' }">Diagnostics</a> shows what it spent.</small>
    </span>
  </label>
  <p class="muted edit-hint">Saves as you change it.</p>

  <div class="links" style="margin-top: 12px;">
    @if (data.mode === 'firebase') {
      <button class="view-btn" type="button" (click)="ctx.seed()">Seed database from starter data</button>
    } @else {
      <button class="view-btn" type="button" (click)="ctx.resetLocal()">Reset local data</button>
    }
  </div>
</section>
