<section class="card">
  <h2 class="title-with-icon"><span class="section-icon">ST</span>Settings</h2>
  <label class="field">
    <span>Team name</span>
    <input type="text" [ngModel]="ctx.teamName()" (ngModelChange)="ctx.teamName.set($event)" name="ctx.teamName" />
  </label>
  <label class="field field-check">
    <input type="checkbox" [ngModel]="ctx.autoAdvisor()" (ngModelChange)="ctx.autoAdvisor.set($event)" name="ctx.autoAdvisor" />
    <span>
      Ask the advisor automatically when a draft step becomes ours
      <small class="muted">Off: the room only answers when someone presses "Ask what to pick". Either way an answer costs one model call.</small>
    </span>
  </label>
  <button class="view-btn active" type="button" (click)="ctx.saveSettings()">Save settings</button>

  <div class="links" style="margin-top: 12px;">
    @if (data.mode === 'firebase') {
      <button class="view-btn" type="button" (click)="ctx.seed()">Seed database from starter data</button>
    } @else {
      <button class="view-btn" type="button" (click)="ctx.resetLocal()">Reset local data</button>
    }
  </div>
</section>
