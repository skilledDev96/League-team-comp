<section class="hero">
  <h1>Tournaments</h1>
  <p>Series planning and live Fearless Draft tracking.</p>
</section>

<section class="view-controls" aria-label="View">
  <button type="button" class="view-btn" [class.active]="view() === 'plan'" (click)="view.set('plan')">
    <span class="material-symbols-rounded" aria-hidden="true">calendar_month</span> Plan
  </button>
  <button type="button" class="view-btn" [class.active]="view() === 'draft'" (click)="view.set('draft')">
    <span class="material-symbols-rounded" aria-hidden="true">swords</span> Draft
  </button>
</section>

@if (view() === 'plan') {
  <app-tournament-plan />
} @else {
  <app-tournament-draft />
}

<datalist id="champlist">
  @for (champ of champData.champions(); track champ.id) {
    <option [value]="champ.name"></option>
  }
</datalist>
