<!-- The slim hero (13 Sep 2026): what the page holds, the title, one line, the tour pill. -->
<section class="hero is-slim" appInView>
  <div class="hero-id">
    <p class="home-kicker hero-kicker"><span class="material-symbols-rounded" aria-hidden="true">swords</span>{{ heading() }}</p>
    <h1 class="hero-title">Prep &amp; Draft</h1>
    <p class="hero-blurb">Every opponent we prep for and draft against, scrim or tournament.</p>
  </div>
  <div class="hero-actions">
    <app-tour-pill />
  </div>
</section>

<!-- One toolbar on every page, the Games one (12 Sep 2026, the lead: "I like how the games top page
     looks, with the detail option on the right — make this consistent across all pages"). The views as
     pills on the left, anything that belongs to the whole page pushed right, Detail last. -->
<section class="view-controls is-slim" aria-label="View">
  <button type="button" class="view-btn" [class.active]="view() === 'plan'" (click)="view.set('plan')">
    <span class="material-symbols-rounded" aria-hidden="true">calendar_month</span> Plan
  </button>
  <button type="button" class="view-btn" [class.active]="view() === 'draft'" (click)="view.set('draft')">
    <span class="material-symbols-rounded" aria-hidden="true">swords</span> Draft
  </button>
  <!-- Plan only: the draft room is not a depth surface. Removed rather than hidden on Draft, because
       the switch is taller than the pills and an invisible one pushed the whole room 35px down. -->
  @if (view() === 'plan') {
    <!-- One roster surface at both depths since 20 Sep 2026, so the two tips describe the same
         table filled out to different widths rather than two different views. -->
    <app-detail-toggle surface="prep"
                       starterTip="Starter is their five on a line each: the seat, both ranks and the three champions they live on, with the ban board and the games"
                       fullTip="Full fills each line out with the games behind the ranks and who beats them, and adds their games one by one. Any line opens for the rest at either depth." />
  }
</section>

@if (view() === 'plan') {
  <app-tournament-plan />
} @else {
  <app-tournament-draft />
}

<datalist id="champlist">
  @for (champ of champData.champions(); track champ.id) {
    <option [value]="champ.name"></option>
  }
</datalist>
