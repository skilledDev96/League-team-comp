<div class="board-filters">
  <input type="text" class="board-search" [ngModel]="query()" (ngModelChange)="query.set($event)"
         name="boardSearch" placeholder="Search…" autocomplete="off"
         [attr.aria-label]="'Search champions'" />
  <!-- Lanes, not Riot's class tags. The chips answer "who can go here", which
       is the only question being asked with a champion in hand. -->
  <div class="board-tags" role="group" aria-label="Filter by lane">
    <button type="button" class="tag board-tag" [class.active]="roleFilter() === null"
            (click)="chooseLane(null)">All</button>
    @for (role of roles; track role) {
      <button type="button" class="tag board-tag" [class.active]="roleFilter() === role"
              (click)="chooseLane(roleFilter() === role ? null : role)">{{ role }}</button>
    }
  </div>
</div>

<!-- Always rendered, even unfiltered. Showing it only when a lane is chosen
     made the line appear and disappear on every filter, moving everything
     below it — and in a draft you filter constantly. -->
<p class="board-lane-note">
  @if (hiddenByLane() > 0) {
    {{ grid().length }} {{ roleFilter() }} champions.
    <button type="button" class="link-btn" (click)="chooseLane(null)">
      Show all {{ hiddenByLane() }} others
    </button>
  } @else {
    {{ grid().length }} champions.
  }
</p>

@if (champs.ready() && grid().length === 0) {
  <p class="muted">No champion matches that.</p>
}

<div class="board-grid" role="listbox" aria-label="Champions">
  @for (champ of grid(); track champ.id) {
    <button type="button" class="board-champ"
            [class.is-taken]="isTaken(champ.name)"
            [class.is-blocked]="isBlocked(champ.name)"
            [disabled]="isBlocked(champ.name)"
            [title]="isBlocked(champ.name) ? champ.name + ' is unavailable' : champ.name"
            (click)="choose(champ.name)">
      <img [src]="ui.championIconUrl(champ.name)" [alt]="" loading="lazy" />
      <span class="board-champ-label">{{ champ.name }}</span>
      @if (isTaken(champ.name)) {
        <span class="board-check material-symbols-rounded" aria-hidden="true">check</span>
      }
    </button>
  }
</div>
