<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="League of Legends team stats, champion pools, and team compositions.">
  <title>League Team Hub</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b12;
      color: #f5f5f5;
    }
    * {
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(900px, 100%);
    }
    h1 {
      margin-bottom: 8px;
      color: #ffb347;
    }
    p {
      color: #c0c0d9;
    }
    nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 32px;
    }
    a {
      padding: 24px;
      border: 1px solid #26263a;
      border-radius: 12px;
      background: #151522;
      color: #9fd3ff;
      font-size: 1.2rem;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover,
    a:focus-visible {
      border-color: #ffb347;
      transform: translateY(-2px);
    }
    a span {
      display: block;
      margin-top: 8px;
      color: #c0c0d9;
      font-size: 0.9rem;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <main>
    <h1>League Team Hub</h1>
    <p>Team champion pools, compositions, and stats in one place.</p>
    <nav aria-label="Team pages">
      <a href="champs.html">
        Champion Pools
        <span>View each player's main champions and learning picks.</span>
      </a>
      <a href="team-comps.html">
        Team Compositions
        <span>Browse engage, pick, dive, poke, and teamfight comps.</span>
      </a>
    </nav>
  </main>
</body>
</html>
