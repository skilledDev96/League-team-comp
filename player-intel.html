<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bom Squad Player Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function () {
    const stored = localStorage.getItem("bom-theme");
    const valid = ["dark", "dark-blue", "dark-red", "light"];
    const theme = valid.includes(stored)
      ? stored
      : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-initial-theme", theme);
  })();
</script>
<link rel="stylesheet" href="styles/main.css?v=14">
</head>
<body data-theme="dark">
  <div class="page">
    <header class="topbar">
      <div class="brand" id="brandTitle">
        Bom Squad
        <small>Player Profile</small>
      </div>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Overview</a>
        <a href="champs.html">Player Intel</a>
        <a href="team-comps.html">Comps and Macro</a>
        <label for="themeSelect" class="visually-hidden">Theme</label>
        <select id="themeSelect" class="theme-select" data-theme-select aria-label="Theme selector">
          <option value="dark">Dark</option>
          <option value="dark-blue">Blue</option>
          <option value="dark-red">Red</option>
          <option value="light">Light</option>
        </select>
      </nav>
    </header>

    <section class="hero">
      <h1 id="pageTitle">Player Profile</h1>
      <p id="pageSubtitle">Focused intel for one player.</p>
    </section>

    <section class="grid two">
      <article class="card" id="playerCard"></article>
      <article class="card">
        <h2 class="title-with-icon"><span class="section-icon">NX</span>Quick Actions</h2>
        <div class="links" id="quickLinks">
          <a href="champs.html">Back to full Player Intel</a>
          <a href="index.html">Back to Overview</a>
          <a href="team-comps.html">Open team comps</a>
        </div>
      </article>
    </section>
  </div>

  <script>
    document.body.setAttribute("data-theme", document.documentElement.getAttribute("data-initial-theme") || "dark");
  </script>
  <script src="scripts/theme.js?v=4"></script>
  <script src="scripts/team-data.js?v=4"></script>
  <script src="scripts/ui.js?v=8"></script>
  <script>
    window.Theme.initThemeToggle();

    const data = window.TEAM_DATA;
    const ui = window.UI;

    document.getElementById("brandTitle").firstChild.textContent = data.teamName;

    const params = new URLSearchParams(window.location.search);
    const requestedPlayer = params.get("player");
    const rosterEntries = Object.entries(data.team);

    let selectedRole = rosterEntries[0][0];
    let selectedPlayer = rosterEntries[0][1];

    if (requestedPlayer) {
      const hit = rosterEntries.find((entry) => entry[1].toLowerCase() === requestedPlayer.toLowerCase());
      if (hit) {
        selectedRole = hit[0];
        selectedPlayer = hit[1];
      }
    }

    document.getElementById("pageTitle").textContent = `${selectedRole} - ${selectedPlayer}`;
    document.getElementById("pageSubtitle").textContent = `Single-player prep view for ${selectedPlayer}.`;

    const stats = data.strengthsWeaknesses[selectedPlayer];
    const champs = data.top3Champs[selectedPlayer];
    const bans = data.banRecommendations[selectedPlayer];
    const icon = data.summonerIcons[selectedPlayer];
    const quickLinks = document.getElementById("quickLinks");

    if (quickLinks) {
      const opggProfile = ui.createExternalLink(ui.summonerSearchUrl(selectedPlayer), "OP.GG player profile");
      quickLinks.prepend(opggProfile);

      const mobalyticsUrl = ui.summonerMobalyticsUrl(selectedPlayer);
      if (mobalyticsUrl) {
        const mobalyticsProfile = ui.createExternalLink(mobalyticsUrl, "Mobalytics player profile");
        quickLinks.insertBefore(mobalyticsProfile, quickLinks.children[1] || null);
      }
    }

    const card = document.getElementById("playerCard");

    const titleRow = document.createElement("div");
    titleRow.className = "title-row";
    titleRow.appendChild(ui.createPlayerAvatar(selectedPlayer, icon, { role: selectedRole }));

    const title = document.createElement("h2");
    title.textContent = `${selectedRole} - ${selectedPlayer}`;
    titleRow.appendChild(title);
    card.appendChild(titleRow);

    card.appendChild(ui.createPlaystyleLine(data.playstyles[selectedPlayer]));

    const mainChamp = document.createElement("p");
    mainChamp.className = "meta-line main-champ-inline";
    mainChamp.innerHTML = `<img class="main-champ-icon" src="${ui.championIconUrl(champs.top3[0])}" alt="${champs.top3[0]} icon"><span class="meta-label">Main Champion</span><span class="meta-value">${champs.top3[0]}</span>`;
    card.appendChild(mainChamp);

    const strengthsTitle = document.createElement("h3");
    strengthsTitle.textContent = "Strengths";
    card.appendChild(strengthsTitle);

    const strengthsRow = document.createElement("div");
    strengthsRow.className = "tag-row";
    for (const item of stats.strengths) {
      strengthsRow.appendChild(ui.createTag(item, "tag good"));
    }
    card.appendChild(strengthsRow);

    const weakTitle = document.createElement("h3");
    weakTitle.textContent = "Weaknesses";
    card.appendChild(weakTitle);

    const weakRow = document.createElement("div");
    weakRow.className = "tag-row";
    for (const item of stats.weaknesses) {
      weakRow.appendChild(ui.createTag(item, "tag bad"));
    }
    card.appendChild(weakRow);

    const champTitle = document.createElement("h3");
    champTitle.textContent = "Champion Pool";
    card.appendChild(champTitle);

    const champRow = document.createElement("div");
    champRow.className = "champ-chip-row";
    for (const champion of champs.top3) {
      champRow.appendChild(ui.createChampionChip(champion, champion));
    }
    champRow.appendChild(ui.createChampionChip(champs.learn, `Learn: ${champs.learn}`));
    card.appendChild(champRow);

    const linksWrap = document.createElement("div");
    linksWrap.className = "links";
    linksWrap.appendChild(ui.createExternalLink(ui.summonerSearchUrl(selectedPlayer), "OP.GG player profile"));
    const cardMobalyticsUrl = ui.summonerMobalyticsUrl(selectedPlayer);
    if (cardMobalyticsUrl) {
      linksWrap.appendChild(ui.createExternalLink(cardMobalyticsUrl, "Mobalytics player profile"));
    }
    card.appendChild(linksWrap);

    const buildDropdown = document.createElement("details");
    buildDropdown.className = "link-dropdown";
    const buildSummary = document.createElement("summary");
    buildSummary.textContent = `Build Guides (${champs.top3.length + 1})`;
    buildDropdown.appendChild(buildSummary);

    const buildLinks = document.createElement("div");
    buildLinks.className = "links compact";
    for (const champion of champs.top3) {
      buildLinks.appendChild(ui.createExternalLink(ui.championBuildUrl(champion), `Build guide: ${champion}`));
    }
    buildLinks.appendChild(ui.createExternalLink(ui.championBuildUrl(champs.learn), `Learn next build: ${champs.learn}`));
    buildDropdown.appendChild(buildLinks);
    card.appendChild(buildDropdown);

    const banTitle = document.createElement("h3");
    banTitle.textContent = "Suggested Bans";
    card.appendChild(banTitle);

    const banList = document.createElement("ul");
    banList.className = "list-clean";
    for (const ban of bans) {
      const li = document.createElement("li");
      li.textContent = ban;
      banList.appendChild(li);
    }
    card.appendChild(banList);
  </script>
</body>
</html>
